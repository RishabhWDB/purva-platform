# aroha: container app "aroha" in group "aroha". Deployed only from this repo.
# The team's repo (ANSHU-KUMARI08/SkyClearence_AI) can only build images and upload them to
# purvashared82aaf9d4.azurecr.io/aroha; it can't change the app.
SOURCE_REPO=ANSHU-KUMARI08/SkyClearence_AI
# vCPU / memory per copy (memory must be 2 x vCPU, e.g. 0.5 / 1Gi).
CPU=1
MEMORY=2Gi
# 0 = sleeps when unused (first visit waits while it starts), 1 = always on.
MIN_REPLICAS=0
MAX_REPLICAS=1
# Checked after every deploy: must answer 200 (and HEALTH_BODY, if set).
HEALTH_PATH=/health
HEALTH_BODY=
# Static Web App whose upload token the team's website workflow may read.
STATIC_WEB_APP=
