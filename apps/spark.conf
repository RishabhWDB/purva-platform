# spark: container app "spark" in group "spark". Deployed only from this repo.
# The team's repo (RishabhWDB/PurvaChatbot) can only build images and upload them to
# purvashared82aaf9d4.azurecr.io/spark; it can't change the app.
SOURCE_REPO=RishabhWDB/PurvaChatbot
# vCPU / memory per copy (memory must be 2 x vCPU, e.g. 0.5 / 1Gi).
CPU=0.25
MEMORY=0.5Gi
# 0 = sleeps when unused (first visit waits while it starts), 1 = always on.
MIN_REPLICAS=1
MAX_REPLICAS=1
# Checked after every deploy: must answer 200 (and HEALTH_BODY, if set).
HEALTH_PATH=/health
HEALTH_BODY=ok
# Static Web App whose upload token the team's website workflow may read.
STATIC_WEB_APP=
