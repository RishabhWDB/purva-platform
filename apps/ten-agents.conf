# ten-agents: container app "ten-agents" in group "ten-agents". Deployed only from this repo.
# The team's repo (SAVANTH286/puravankara-ai-market-dss) can only build images and upload them to
# purvashared82aaf9d4.azurecr.io/ten-agents; it can't change the app.
SOURCE_REPO=SAVANTH286/puravankara-ai-market-dss
# vCPU / memory per copy (memory must be 2 x vCPU, e.g. 0.5 / 1Gi).
CPU=0.5
MEMORY=1Gi
# 0 = sleeps when unused (first visit waits while it starts), 1 = always on.
MIN_REPLICAS=0
MAX_REPLICAS=1
# Checked after every deploy: must answer 200 (and HEALTH_BODY, if set).
HEALTH_PATH=/health
HEALTH_BODY=
# Static Web App whose upload token the team's website workflow may read.
STATIC_WEB_APP=
