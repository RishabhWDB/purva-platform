# reaa: container app "reaa" in group "reaa". Deployed only from this repo.
# The team's repo (Virajcreates/ReAA2.0) can only build images and upload them to
# purvashared82aaf9d4.azurecr.io/reaa; it can't change the app.
SOURCE_REPO=Virajcreates/ReAA2.0
# vCPU / memory per copy (memory must be 2 x vCPU, e.g. 0.5 / 1Gi).
CPU=0.5
MEMORY=1Gi
# 0 = sleeps when unused (first visit waits while it starts), 1 = always on.
MIN_REPLICAS=0
MAX_REPLICAS=2
# Checked after every deploy: must answer 200 (and HEALTH_BODY, if set).
HEALTH_PATH=/login
HEALTH_BODY=
# Static Web App whose upload token the team's website workflow may read.
STATIC_WEB_APP=
