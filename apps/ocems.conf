# ocems: container app "ocems" in group "ocems". Deployed only from this repo.
# The team's repo (Virajcreates/OCEMS_Dashboard) can only build images and upload them to
# purvashared82aaf9d4.azurecr.io/ocems; it can't change the app.
SOURCE_REPO=Virajcreates/OCEMS_Dashboard
# vCPU / memory per copy (memory must be 2 x vCPU, e.g. 0.5 / 1Gi).
# Measured ~50 MiB idle, ~59 MiB at the heaviest real load.
CPU=0.25
MEMORY=0.5Gi
# 0 = sleeps when unused (first visit waits while it starts), 1 = always on.
# Must stay 1-1: a 60 s live poller runs inside the app, and its data is a SQLite
# file in the container (a second copy would have different data).
MIN_REPLICAS=1
MAX_REPLICAS=1
# Checked after every deploy: must answer 200 (and HEALTH_BODY, if set).
# /healthz needs no login; every other path asks for the app's password.
HEALTH_PATH=/healthz
HEALTH_BODY=
# Static Web App whose upload token the team's website workflow may read.
STATIC_WEB_APP=
